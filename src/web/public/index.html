<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>چارت زنده</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/lightweight-charts@5.2.0/dist/lightweight-charts.standalone.production.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="bar">
  <select id="coin" aria-label="ارز"></select>
  <div class="seg" id="dir">
    <button data-dir="long" class="on">خرید</button>
    <button data-dir="short">فروش</button>
  </div>
  <div id="score" class="score">—</div>
</header>
<nav class="tabs" id="mode">
  <button data-mode="bot" class="on">🤖 تحلیلِ بات</button>
  <button data-mode="teacher">✍️ تحلیلِ استاد</button>
</nav>

<div id="charts">
  <div id="chart"></div>
  <div id="legend" class="legend"></div>
  <div id="countdown" class="countdown" hidden></div>
  <div id="loading" class="overlay">در حالِ گرفتنِ کندل‌ها…</div>
</div>

<div class="tools" id="ttools" hidden></div>
<div class="tools" id="thint" hidden><span id="hint" class="hint"></span></div>
<div class="tools nudge" id="nudge" hidden></div>
<section id="review" class="card review" hidden></section>
<section id="chips" class="chips"></section>
<section id="info" class="info"></section>

<main id="controls"></main>

<footer class="savebar" id="savebar" hidden>
  <span id="dirty"></span>
  <button id="revert" class="ghost">برگرداندن</button>
  <button id="save" class="primary">ذخیره در بات</button>
</footer>
<div id="toast" class="toast" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
